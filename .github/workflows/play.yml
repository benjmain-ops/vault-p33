# Player bot: sells the vault's yield, buys the lottery tickets from the player wallet,
# claims its prizes. See README, "Automatic play".
#
# Draws are at 06:00 and 18:00 UTC. Two runs before each draw: the second one only acts if the
# first one was skipped or failed (every step of the bot is idempotent).
name: play

on:
  schedule:
    - cron: "13 3,4,15,16 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print what would be done, send nothing"
        type: boolean
        default: false
      scheduled:
        description: "Started by an outside scheduler: recap only when something happened"
        type: boolean
        default: false

permissions:
  contents: read
  actions: write # only used to keep this schedule enabled (see the last step)

concurrency:
  group: play
  cancel-in-progress: false

jobs:
  play:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # No third-party action: this job holds a wallet key.
      - name: Fetch the code
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone --quiet --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" .
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git log -1 --format='commit %h'

      # Only what the bots need at run time (keeper/package.json), not the development tools.
      - name: Install dependencies
        run: npm ci --prefix keeper --ignore-scripts --no-audit --no-fund

      - name: Play
        env:
          PLAYER_PRIVATE_KEY: ${{ secrets.PLAYER_PRIVATE_KEY }}
          VAULT: ${{ secrets.VAULT }}
          RPC_URL: ${{ secrets.RPC_URL }}
          # optional settings: accepted as repository variables or as secrets
          TICKETS_PER_DRAW: ${{ vars.TICKETS_PER_DRAW || secrets.TICKETS_PER_DRAW }}
          KEEP_TICKETS: ${{ vars.KEEP_TICKETS || secrets.KEEP_TICKETS }}
          SHOW_AMOUNTS: ${{ vars.SHOW_AMOUNTS || secrets.SHOW_AMOUNTS }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          RECAP_FILE: ${{ runner.temp }}/recap.txt
          # a manual run always produces a recap, which also tests the notification
          RECAP_ALWAYS: ${{ github.event_name == 'workflow_dispatch' && !inputs.scheduled && '1' || '' }}
        run: |
          if [ -z "$PLAYER_PRIVATE_KEY" ] || [ -z "$VAULT" ]; then
            echo "Not configured: add the PLAYER_PRIVATE_KEY and VAULT secrets (README, Automatic play)."
            exit 0
          fi
          node keeper/player.js

      # Private recap of the pass (tickets bought, prizes, problems), sent to a Telegram chat.
      # This step has the bot token of the chat, not the wallet key. The answer of the API
      # is discarded: it contains the name of the chat.
      - name: Notify
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RECAP_FILE: ${{ runner.temp }}/recap.txt
        run: |
          if [ ! -s "$RECAP_FILE" ]; then echo "Nothing to report."; exit 0; fi
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "No notification channel configured (TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID)."
          elif curl -fsS --max-time 20 -o /dev/null "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                 --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" --data-urlencode "text@${RECAP_FILE}" 2>/dev/null; then
            echo "Notification sent."
          else
            echo "Notification not sent: check the two Telegram secrets, and that you wrote to the bot once."
          fi
          rm -f "$RECAP_FILE"

      # GitHub disables scheduled workflows of public repositories after 60 days without
      # repository activity. Re-enabling the workflow counts as activity for that timer.
      - name: Keep the schedule enabled
        if: always() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/play.yml/enable" || true
