# Cloudflare Worker that starts the bots' workflows on time. See README, "Running on time".
name = "lottery-scheduler"
main = "worker.js"
compatibility_date = "2026-01-01"
workers_dev = false          # no public address
preview_urls = false

[vars]
GH_REPO = "benjmain-ops/vault-p33"   # the repository whose workflows are started; change it in a fork

[triggers]
# UTC. Draws are at 06:00 and 18:00 UTC. These must match the keys of SCHEDULE in worker.js.
crons = ["13 3,4,15,16 * * *", "30,44 5,17 * * *", "1,5,35 6,18 * * *"]
