<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sixte</title>
<meta name="description" content="Sixte: an independent interface to play the AVAX lottery. 6 numbers out of 24, two draws a day.">
<meta name="theme-color" content="#EDF0F3">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sixte">
<meta property="og:type" content="website">
<meta property="og:title" content="Sixte">
<meta property="og:description" content="AVAX lottery: 6 numbers out of 24, two draws a day. Tick your line and play from your wallet.">
<meta property="og:url" content="https://benjmain-ops.github.io/vault-p33/play/">
<meta property="og:image" content="https://benjmain-ops.github.io/vault-p33/play/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<style>
  @font-face {
    font-family: "Archivo";
    src: url("fonts/archivo.woff2") format("woff2");
    font-weight: 100 900;
    font-stretch: 62% 125%;
    font-display: swap;
  }
  :root {
    --page: #EDF0F3;
    --paper: #FFFFFF;
    --ink: #15181D;
    --muted: #5B6472;
    --rule: #D3D9E0;
    --red: #DC2F33;      /* the slip's printing ink */
    --pen: #1B3FA8;      /* what the player writes */
    --hi: #FFE45C;       /* highlighter over matched numbers */
    --bad: #B3261E;
    --wide: 100%;
    --narrow: 64%;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--ink);
    font: 400 1rem/1.5 "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-stretch: var(--wide);
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:disabled { cursor: default; }
  :focus-visible { outline: 3px solid var(--pen); outline-offset: 2px; border-radius: 4px; }
  a { color: var(--pen); }
  .num { font-variant-numeric: tabular-nums; }
  [hidden] { display: none !important; }

  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 16px; }

  /* top bar */
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 0; }
  .brand { font-weight: 800; font-stretch: var(--narrow); font-size: 1.75rem; letter-spacing: 0.01em; color: var(--ink); text-decoration: none; line-height: 1; }
  .top-actions { display: flex; align-items: center; gap: 8px; }
  .btn {
    border: 1.5px solid var(--ink); background: transparent; border-radius: 8px;
    padding: 10px 14px; font-weight: 650; line-height: 1.2; min-height: 44px;
  }
  .btn.primary { background: var(--pen); border-color: var(--pen); color: #fff; }
  a.btn { display: inline-flex; align-items: center; text-decoration: none; color: var(--ink); }
  a.btn.primary { color: #fff; }
  .btn.primary:disabled { background: #9AA6C7; border-color: #9AA6C7; }
  .btn.quiet { border-color: transparent; padding-inline: 10px; color: var(--muted); }
  .btn.small { min-height: 38px; padding: 7px 12px; font-size: 0.9375rem; }

  /* offer to install the page on the home screen */
  .install { display: flex; justify-content: space-between; align-items: center; gap: 10px 14px; flex-wrap: wrap; background: var(--paper); border-radius: 8px; padding: 12px 14px; box-shadow: 0 0 0 1px var(--rule); }
  .install p { margin: 0; flex: 1 1 220px; }
  .install div { display: flex; gap: 6px; }

  /* first visit: the three steps from nothing to a ticket */
  .start { background: var(--paper); border-radius: 8px; padding: 14px 14px 12px; margin-top: 10px; box-shadow: 0 0 0 1px var(--rule); }
  .start-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .start-head strong { font-weight: 800; font-stretch: var(--narrow); font-size: 1.25rem; }
  .firsts { list-style: none; margin: 10px 0 0; padding: 0; counter-reset: step; }
  .firsts li { counter-increment: step; position: relative; padding: 9px 0 9px 42px; border-top: 1px solid var(--rule); color: var(--muted, inherit); }
  .firsts li::before { content: counter(step); position: absolute; left: 0; top: 7px; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center;
    border: 1.5px solid var(--rule); font-weight: 800; font-stretch: var(--narrow); line-height: 1; }
  .firsts li b { font-weight: 750; }
  .firsts li.done::before { content: "✓"; background: var(--pen); border-color: var(--pen); color: #fff; }
  .firsts li.now { color: inherit; }
  .firsts li.now::before { border-color: var(--red); color: var(--red); }
  .firsts li p { margin: 4px 0 0; }
  .firsts li .acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 9px; }
  .firsts li small { display: block; margin-top: 8px; font-size: 0.875rem; opacity: 0.8; }
  .start-note { margin: 8px 0 0; padding-top: 9px; border-top: 1px solid var(--rule); font-size: 0.875rem; opacity: 0.8; }

  /* lead: the countdown is the headline */
  .lead { padding: 20px 0 22px; }
  h1 {
    margin: 0; font-weight: 800; font-stretch: var(--narrow);
    font-size: clamp(2.4rem, 10.5vw, 5rem); line-height: 0.95; letter-spacing: -0.005em;
    text-wrap: balance;
  }
  .lead p { margin: 12px 0 0; color: var(--muted); max-width: 46ch; }

  .layout { display: grid; gap: 28px; }
  @media (min-width: 940px) {
    .layout { grid-template-columns: minmax(0, 540px) minmax(0, 1fr); gap: 56px; align-items: start; }
  }

  /* the play slip */
  .slip {
    background: var(--paper); border-radius: 8px; position: relative;
    box-shadow: 0 0 0 1px var(--rule), 0 18px 28px -22px rgba(21, 24, 29, 0.55);
  }
  /* timing marks, as on a slip read by a machine */
  .slip::before {
    content: ""; display: block; height: 9px; margin: 0 18px;
    background: repeating-linear-gradient(90deg, var(--ink) 0 5px, transparent 5px 15px);
    transform: translateY(10px);
  }
  .slip-body { padding: 26px 18px 18px; }
  .slip-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; color: var(--red); }
  .slip-head strong { font-weight: 800; font-stretch: var(--narrow); font-size: 1.25rem; letter-spacing: 0.01em; }
  .slip-head span { font-size: 0.875rem; font-weight: 600; }

  .lines { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0 14px; }
  .line-tab {
    width: 44px; height: 44px; border-radius: 50%; border: 1.5px solid var(--rule); background: var(--paper);
    font-weight: 750; font-stretch: var(--narrow); font-size: 1.125rem; color: var(--muted); position: relative;
  }
  .line-tab[aria-selected="true"] { border-color: var(--pen); color: var(--pen); box-shadow: inset 0 0 0 1.5px var(--pen); }
  .line-tab.full { background: var(--pen); border-color: var(--pen); color: #fff; }
  .line-tab.full[aria-selected="true"] { box-shadow: 0 0 0 2px var(--paper), 0 0 0 4px var(--pen); }
  .line-tab.add { border-style: dashed; color: var(--ink); }

  .grid-label { display: flex; justify-content: space-between; align-items: baseline; margin: 0 0 8px; }
  .grid-label b { font-weight: 650; }
  .grid-label span { color: var(--muted); font-size: 0.9375rem; }
  .grid { display: grid; gap: 7px; }
  .grid.main { grid-template-columns: repeat(6, 1fr); }
  .grid.comp { grid-template-columns: repeat(6, 1fr); }
  .box {
    position: relative; aspect-ratio: 1; border: 1.5px solid var(--red); border-radius: 7px; background: var(--paper);
    color: var(--red); font-weight: 750; font-stretch: var(--narrow); font-size: clamp(1.15rem, 5.2vw, 1.5rem); line-height: 1;
    display: grid; place-items: center; padding: 0;
  }
  .grid.comp .box { border-radius: 50%; }
  .box svg { position: absolute; inset: 9%; width: 82%; height: 82%; display: none; pointer-events: none; transform: rotate(var(--r, 0deg)); }
  .box[aria-pressed="true"] svg { display: block; }
  .box svg { mix-blend-mode: multiply; }
  .box svg path { fill: none; stroke: var(--pen); stroke-width: 3.3; stroke-linecap: round; }
  .box.fresh svg path { stroke-dasharray: 42; stroke-dashoffset: 42; animation: stroke 0.14s ease-out forwards; }
  .box.fresh svg path { animation-delay: var(--d, 0ms); }
  .box.fresh svg path + path { animation-delay: calc(var(--d, 0ms) + 90ms); }
  @keyframes stroke { to { stroke-dashoffset: 0; } }
  .box:disabled:not([aria-pressed="true"]) { opacity: 0.42; }
  @media (prefers-reduced-motion: reduce) { .box.fresh svg path { animation: none; stroke-dashoffset: 0; } }

  .comp-block { margin-top: 18px; }
  .slip-actions { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }

  /* perforation between the grids and the stub */
  .perf { position: relative; border-top: 2px dashed #C3CAD3; margin: 0; }
  .perf::before, .perf::after {
    content: ""; position: absolute; top: -10px; width: 18px; height: 18px; border-radius: 50%; background: var(--page);
    box-shadow: inset 0 0 0 1px var(--rule);
  }
  .perf::before { left: -9px; clip-path: inset(0 0 0 50%); }
  .perf::after { right: -9px; clip-path: inset(0 50% 0 0); }

  .stub { padding: 18px; }
  .stub-row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .stub-total { font-weight: 800; font-stretch: var(--narrow); font-size: 2rem; line-height: 1.1; }
  .stub-note { color: var(--muted); font-size: 0.9375rem; margin: 6px 0 0; }
  .stub .btn.primary { width: 100%; margin-top: 14px; min-height: 52px; font-size: 1.0625rem; }
  .steps { list-style: none; margin: 12px 0 0; padding: 0; font-size: 0.9375rem; color: var(--muted); }
  .steps li { padding: 3px 0 3px 22px; position: relative; }
  .steps li::before { content: ""; position: absolute; left: 3px; top: 0.72em; width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--muted); }
  .steps li.doing { color: var(--ink); font-weight: 600; }
  .steps li.doing::before { border-color: var(--pen); background: var(--pen); }
  .steps li.done::before { border-color: var(--ink); background: var(--ink); }

  /* facts and ranks */
  h2 { margin: 0 0 10px; font-weight: 800; font-stretch: var(--narrow); font-size: 1.75rem; line-height: 1.1; }
  .facts dl { margin: 0 0 26px; }
  .facts dl div { display: flex; justify-content: space-between; gap: 16px; padding: 10px 0; border-bottom: 1px solid var(--rule); }
  .facts dt { color: var(--muted); }
  .facts dd { margin: 0; font-weight: 650; text-align: right; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: right; padding: 9px 0 9px 10px; border-bottom: 1px solid var(--rule); white-space: nowrap; }
  th { font-weight: 600; color: var(--muted); font-size: 0.875rem; vertical-align: bottom; white-space: normal; }
  th:first-child, td:first-child { text-align: left; padding-left: 0; }
  td.combo { font-weight: 700; font-stretch: var(--narrow); font-size: 1.125rem; }
  tr.top-rank td { font-weight: 750; }
  .fine { color: var(--muted); font-size: 0.9375rem; margin: 12px 0 0; max-width: 60ch; }

  /* tickets and results */
  .below { margin-top: 44px; }
  .tabs { display: flex; gap: 22px; border-bottom: 1px solid var(--rule); margin-bottom: 6px; }
  .tab { border: 0; background: none; padding: 10px 0; font-weight: 800; font-stretch: var(--narrow); font-size: 1.5rem; color: var(--muted); border-bottom: 3px solid transparent; margin-bottom: -1px; }
  .tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); }
  .group { padding: 16px 0; border-bottom: 1px solid var(--rule); }
  .group-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
  .group-head b { font-weight: 700; }
  .group-head span { color: var(--muted); font-size: 0.9375rem; }
  .ticket { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 6px 0; flex-wrap: wrap; }
  .chips { display: flex; gap: 5px; flex-wrap: wrap; align-items: center; }
  .chip {
    min-width: 30px; height: 30px; padding: 0 4px; border: 1.5px solid var(--rule); border-radius: 6px; display: inline-grid; place-items: center;
    font-weight: 700; font-stretch: var(--narrow); font-size: 1rem; line-height: 1; background: var(--paper);
  }
  .chip.comp { border-radius: 50%; }
  .chip.gap { border: 0; background: none; min-width: 6px; padding: 0; }
  .chip.hit { background: var(--hi); border-color: #D9B800; }
  .chip.drawn { border-color: var(--ink); }
  .drawn-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 2px 0 10px; }
  .drawn-row > span { color: var(--muted); font-size: 0.9375rem; }
  .verdict { font-size: 0.9375rem; color: var(--muted); }
  .verdict.win { color: var(--ink); font-weight: 700; }
  .claim { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding: 14px 16px; margin: 14px 0 4px; background: var(--hi); border-radius: 8px; }
  .claim p { margin: 0; font-weight: 650; }
  .claim small { display: block; font-weight: 400; }
  .empty { color: var(--muted); padding: 18px 0; margin: 0; max-width: 52ch; }

  footer { margin-top: 56px; padding: 22px 0 40px; border-top: 1px solid var(--rule); color: var(--muted); font-size: 0.9375rem; }
  footer p { margin: 0 0 10px; max-width: 72ch; }
  footer code { font: inherit; word-break: break-all; }

  /* wallet dialog */
  dialog { border: 0; border-radius: 12px; padding: 22px; width: min(92vw, 400px); color: var(--ink); background: var(--paper); box-shadow: 0 30px 60px -30px rgba(21, 24, 29, 0.6); }
  dialog::backdrop { background: rgba(21, 24, 29, 0.45); }
  dialog h2 { font-size: 1.5rem; }
  dialog .btn { width: 100%; margin-top: 8px; text-align: left; }
  dialog p { color: var(--muted); font-size: 0.9375rem; margin: 10px 0 0; }

  /* drawn numbers are balls in the slip's red: solid for the numbers, ringed for the extras */
  .balls { display: flex; gap: 5px; flex-wrap: wrap; align-items: center; }
  .ball {
    width: 30px; height: 30px; border-radius: 50%; display: inline-grid; place-items: center; flex: none;
    font-weight: 800; font-stretch: var(--narrow); font-size: 1rem; line-height: 1; color: #fff;
    background: var(--red); box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.16);
  }
  .ball.extra { background: var(--paper); color: var(--red); box-shadow: inset 0 0 0 2.5px var(--red); }
  .balls .plus { color: var(--muted); font-weight: 700; padding: 0 1px; }
  @media (min-width: 480px) { .ball { width: 34px; height: 34px; font-size: 1.0625rem; } }
  .last { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 16px; min-height: 34px; }
  .last > span { color: var(--muted); font-size: 0.9375rem; }
  .w, .c { display: inline-block; }
  .w { white-space: nowrap; }
  .confetti { position: fixed; pointer-events: none; z-index: 30; }
  .confetti i { position: absolute; width: 9px; height: 9px; background: var(--c); opacity: 0; }

  /* motion: the countdown ticks, balls drop and roll, the pen runs, the stub tears off, a win gets confetti */
  @media (prefers-reduced-motion: no-preference) {
    .c.tick { animation: tick 0.24s cubic-bezier(0.2, 0.9, 0.3, 1.2); }
    @keyframes tick { from { transform: translateY(-0.4em); opacity: 0; } }
    .balls.drop .ball { animation: drop 0.6s cubic-bezier(0.3, 1.5, 0.5, 1) both; animation-delay: calc(var(--i) * 85ms + 150ms); }
    @keyframes drop { from { transform: translateY(-54px) scale(0.5); opacity: 0; } 55% { opacity: 1; } }
    .balls.roll .ball { animation: roll 0.75s cubic-bezier(0.2, 0.9, 0.3, 1) both; animation-delay: calc(var(--i) * 120ms); }
    @keyframes roll { from { transform: translateX(-140px) rotate(-420deg); opacity: 0; } 35% { opacity: 1; } }
    .line-tab.pop { animation: pop 0.32s cubic-bezier(0.3, 1.6, 0.5, 1); }
    .stub-total.bump { animation: pop 0.28s ease-out; transform-origin: right center; }
    @keyframes pop { 40% { transform: scale(1.2); } }
    .stub.torn { animation: tear 0.55s cubic-bezier(0.5, 0, 0.9, 0.5) forwards; transform-origin: 12% 0; }
    @keyframes tear { 25% { transform: translateY(3px) rotate(-1.2deg); } to { transform: translateY(70px) rotate(-6deg); opacity: 0; } }
    .stub.reprint { animation: reprint 0.35s ease-out; }
    @keyframes reprint { from { transform: translateY(-14px); opacity: 0; } }
    .ticket.new { animation: slip-in 0.45s cubic-bezier(0.2, 0.9, 0.3, 1) both; animation-delay: calc(var(--i) * 70ms); }
    @keyframes slip-in { from { transform: translateY(-12px); opacity: 0; } }
    .chip.hit.sweep { background: linear-gradient(var(--hi), var(--hi)) no-repeat left center / 0 100% var(--paper); animation: sweep 0.35s ease-out forwards; animation-delay: calc(var(--i) * 60ms + 200ms); }
    @keyframes sweep { to { background-size: 100% 100%; } }
    dd.bump { animation: flash 1.1s ease-out; }
    @keyframes flash { from { background: var(--hi); } }
    .confetti i { animation: fly 1.2s cubic-bezier(0.15, 0.7, 0.3, 1) forwards; }
    @keyframes fly { from { opacity: 1; } 70% { opacity: 1; } to { transform: translate(var(--x), var(--y)) rotate(var(--rot)); opacity: 0; } }
  }

  #toast {
    position: fixed; left: 16px; right: 16px; bottom: max(16px, env(safe-area-inset-bottom)); margin: 0 auto; max-width: 520px;
    background: var(--ink); color: #fff; padding: 13px 16px; border-radius: 10px; font-weight: 550; z-index: 10;
  }
  #toast:empty { display: none; }
  #toast[data-kind="err"] { background: var(--bad); }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="brand" href="./">Sixte</a>
    <div class="top-actions">
      <button class="btn quiet small" id="langBtn" type="button"></button>
      <button class="btn small" id="connectBtn" type="button"></button>
    </div>
  </header>

  <div class="install" id="install" hidden>
    <p id="installText"></p>
    <div><button class="btn small primary" id="installBtn" type="button"></button><button class="btn small quiet" id="installLater" type="button"></button></div>
  </div>

  <section class="start" id="start" hidden aria-labelledby="startTitle">
    <div class="start-head"><strong id="startTitle"></strong><button class="btn small quiet" id="startHide" type="button"></button></div>
    <ol class="firsts" id="startSteps"></ol>
    <p class="start-note" id="startNote"></p>
  </section>

  <main>
    <section class="lead">
      <h1 id="headline" class="num">&nbsp;</h1>
      <p id="leadSub">&nbsp;</p>
      <div class="last" id="last" hidden><span id="lastLabel"></span><div class="balls" id="lastBalls"></div></div>
    </section>

    <div class="layout">
      <section class="slip" aria-labelledby="slipTitle">
        <div class="slip-body">
          <div class="slip-head"><strong id="slipTitle"></strong><span id="slipDraw" class="num"></span></div>
          <div class="lines" id="lineTabs" role="tablist"></div>
          <div class="grid-label"><b id="mainLabel"></b><span id="mainCount" class="num"></span></div>
          <div class="grid main" id="mainGrid"></div>
          <div class="comp-block">
            <div class="grid-label"><b id="compLabel"></b><span id="compCount" class="num"></span></div>
            <div class="grid comp" id="compGrid"></div>
          </div>
          <div class="slip-actions">
            <button class="btn small" id="flashBtn" type="button"></button>
            <button class="btn small quiet" id="clearBtn" type="button"></button>
            <button class="btn small quiet" id="flash5Btn" type="button"></button>
          </div>
        </div>
        <hr class="perf">
        <div class="stub">
          <div class="stub-row"><span id="stubLines"></span><span class="stub-total num" id="stubTotal"></span></div>
          <p class="stub-note" id="stubNote"></p>
          <button class="btn primary" id="buyBtn" type="button"></button>
          <ol class="steps" id="steps" hidden></ol>
        </div>
      </section>

      <aside class="facts">
        <h2 id="factsTitle"></h2>
        <dl id="facts"></dl>
        <h2 id="ranksTitle"></h2>
        <table>
          <thead><tr><th id="thCombo"></th><th id="thPrize"></th><th id="thOdds"></th></tr></thead>
          <tbody id="ranks"></tbody>
        </table>
        <p class="fine" id="ranksNote"></p>
      </aside>
    </div>

    <section class="below">
      <div class="tabs" role="tablist">
        <button class="tab" id="tabMine" role="tab" type="button" aria-selected="true"></button>
        <button class="tab" id="tabResults" role="tab" type="button" aria-selected="false"></button>
      </div>
      <div id="mine"></div>
      <div id="results" hidden></div>
    </section>
  </main>

  <footer>
    <p id="footIndep"></p>
    <p id="footRisk"></p>
    <p><a id="footContract" target="_blank" rel="noopener"></a></p>
    <p><a id="footVault" href="../"></a></p>
  </footer>
</div>

<dialog id="walletDlg">
  <h2 id="dlgTitle"></h2>
  <div id="walletList"></div>
  <p id="dlgHint"></p>
  <button class="btn quiet" id="dlgClose" type="button"></button>
</dialog>
<div id="toast" role="status" aria-live="polite"></div>

<script src="../config.js"></script>
<script src="../ethers.umd.min.js"></script>
<script src="../vaultlib.js"></script>
<script>
(() => {
  "use strict";
  const CFG = window.VAULT_CONFIG;
  const E = ethers;
  const $ = (id) => document.getElementById(id);
  const store = {
    get(k) { try { return localStorage.getItem("sixte." + k); } catch (_) { return null; } },
    set(k, v) { try { localStorage.setItem("sixte." + k, v); } catch (_) {} },

      m.onclick = () => { location.href = "https://metamask.app.link/dapp/" + appUrl().replace(/^https?:\/\//, ""); };
      box.appendChild(m);
      $("dlgHint").textContent = L.dlgNoWallet;
    } else $("dlgHint").textContent = L.dlgHint;
    $("walletDlg").showModal();
  }
  async function ensureChain() {
    const want = "0x" + Number(CFG.chainId).toString(16);
    if (Number(await eip1193.request({ method: "eth_chainId" })) === Number(CFG.chainId)) return;
    try { await eip1193.request({ method: "wallet_switchEthereumChain", params: [{ chainId: want }] }); }
    catch (e) {
      if (e.code !== 4902 && !/unrecognized|not been added/i.test(e.message || "")) throw e;
      await eip1193.request({ method: "wallet_addEthereumChain", params: [{
        chainId: want, chainName: CFG.chainName, rpcUrls: [CFG.rpcUrl], blockExplorerUrls: [CFG.explorer],
        nativeCurrency: { name: "Avalanche", symbol: "AVAX", decimals: 18 },
      }] });
    }
  }
  async function connect(p) {
    eip1193 = p;
    const accounts = await eip1193.request({ method: "eth_requestAccounts" });
    if (!accounts.length) throw new Error("no account");
    await ensureChain();
    const provider = new E.BrowserProvider(eip1193, undefined, { cacheTimeout: -1 });
    S.signer = await provider.getSigner();
    S.account = await S.signer.getAddress();
    if (eip1193.on) { eip1193.on("accountsChanged", () => location.reload()); eip1193.on("chainChanged", () => location.reload()); }
    renderChrome(); renderStub(); renderMine();
    await loadAccount();
  }

  // ── actions ──
  async function withBusy(fn) {
    if (S.busy) return;
    S.busy = true; renderStub(); renderMine();
    try { await fn(); } catch (e) { console.error(e); toast(explain(e), "err"); }
    finally { S.busy = false; $("steps").hidden = true; renderStub(); renderMine(); }
  }
  function showSteps(list, at) {
    const ol = $("steps");
    ol.hidden = false; ol.textContent = "";
    list.forEach((txt, i) => { const li = document.createElement("li"); li.textContent = txt; li.className = i < at ? "done" : i === at ? "doing" : ""; ol.appendChild(li); });
  }
  const buy = () => withBusy(async () => {
    await ensureChain();
    await loadDraw();
    const p = plan();
    if (p.n === 0n) return;
    if (!isOpen()) throw new Error("E27");
    const full = S.lines.filter(complete);
    const mains = full.map((l) => [...l.main].sort((a, b) => a - b)), comps = full.map((l) => [...l.comp].sort((a, b) => a - b));
    const lot = lottery.connect(S.signer), wav = wavax.connect(S.signer);
    const allowance = await wavax.allowance(S.account, A.lottery);
    const steps = [];
    if (p.short > 0n) steps.push({ label: L.stepWrap(fmt(p.short)), run: () => wav.deposit({ value: p.short }) });
    if (allowance < p.cost) steps.push({ label: L.stepApprove, run: () => wav.approve(A.lottery, p.cost) });
    steps.push({ label: L.stepBuy, run: async () => {
      const args = [S.drawId, mains, comps, full.map(() => false)];
      await lot.buyMultipleTickets.staticCall(...args); // a refusal shows here, before paying fees
      return lot.buyMultipleTickets(...args);
    } });
    for (let i = 0; i < steps.length; i++) {
      showSteps(steps.map((s) => s.label), i);
      await (await steps[i].run()).wait();
    }
    const had = new Set(S.tickets.map((t) => t.id));
    $("steps").hidden = true;
    await tearStub();
    S.lines = [newLine()]; S.active = 0;
    toast(L.bought(Number(p.n)));
    S.tab = "mine"; renderAll();
    S.newIds = null; S.newShown = false;
    await loadDraw();
    const ids = Array.from(await lottery.getOwnerTickets(S.account));
    S.newIds = new Set(ids.filter((id) => !had.has(id)));
    await refresh();
  });
  const claimPrizes = () => withBusy(async () => {
    await ensureChain();
    const claims = S.plan.claims;
    const lot = lottery.connect(S.signer);
    for (let i = 0; i < claims.length; i += 50) {
      const c = claims.slice(i, i + 50);
      await (await lot.batchClaimTicketPrizes(c.map((x) => x.id), c.map((x) => x.rank), c.map((x) => x.amount), c.map((x) => x.proof))).wait();
    }
    toast(L.claimedToast);
    await loadAccount();
  });
  const cashOut = () => withBusy(async () => {
    await ensureChain();
    const before = await wavax.balanceOf(S.account);
    await (await lottery.connect(S.signer).claimWinnings()).wait();
    toast(L.cashedToast(fmt((await wavax.balanceOf(S.account)) - before)));
    burst($("toast"));
    await loadAccount();
  });

  function randomLine() {
    const pick = (max, k) => {
      const out = [];
      const buf = new Uint32Array(1);
      while (out.length < k) { crypto.getRandomValues(buf); const n = (buf[0] % max) + 1; if (!out.includes(n)) out.push(n); }
      return out;
    };
    return { main: pick(24, 6), comp: pick(5, 2) };
  }

  // ── install on the home screen ──
  let installEvent = null;
  const standalone = (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true;
  const onIos = /iphone|ipad|ipod/i.test(navigator.userAgent);
  function renderInstall() {
    const box = $("install");
    // iOS has no install prompt: its own browser needs the steps spelled out. Nothing can be
    // installed from inside a wallet's browser.
    const iosHint = onIos && !window.ethereum;
    if (standalone || store.get("install") === "later" || (!installEvent && !iosHint)) { box.hidden = true; return; }
    box.hidden = false;
    $("installText").textContent = installEvent ? L.installText : L.installIos;
    $("installBtn").hidden = !installEvent; $("installBtn").textContent = L.installBtn;
    $("installLater").textContent = installEvent ? L.installLater : L.installOk;
  }
  window.addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); installEvent = e; renderInstall(); });
  window.addEventListener("appinstalled", () => { installEvent = null; renderInstall(); });
  $("installBtn").onclick = async () => {
    if (!installEvent) return;
    installEvent.prompt();
    try { await installEvent.userChoice; } catch (_) {}
    installEvent = null; renderInstall();
  };
  $("installLater").onclick = () => { store.set("install", "later"); renderInstall(); };

  // ── wiring ──
  $("flashBtn").onclick = () => { S.lines[S.active] = randomLine(); S.fresh = "all"; S.pop = S.active; renderSlip(); };
  $("clearBtn").onclick = () => { S.lines[S.active] = newLine(); renderSlip(); };
  $("flash5Btn").onclick = () => {
    S.lines = S.lines.filter((l) => l.main.length || l.comp.length);
    for (let i = 0; i < 5 && S.lines.length < MAX_LINES; i++) S.lines.push(randomLine());
    if (!S.lines.length) S.lines.push(newLine());
    S.active = S.lines.length - 1; S.fresh = "all"; S.pop = S.active; renderSlip();
  };
  $("buyBtn").onclick = () => (S.account ? buy() : openWalletDialog());
  $("connectBtn").onclick = () => { if (!S.account) openWalletDialog(); };
  $("dlgClose").onclick = () => $("walletDlg").close();
  $("langBtn").onclick = () => { lang = lang === "fr" ? "en" : "fr"; L = TEXT[lang]; store.set("lang", lang); renderAll(); };
  $("tabMine").onclick = () => { S.tab = "mine"; renderChrome(); };
  $("tabResults").onclick = () => { S.tab = "results"; S.rollResults = true; renderChrome(); renderResults(); };

  renderAll();
  refresh().then(loadRanks);
  setInterval(() => { renderLead(); if (S.draw && S.draw.drawnAt === 0n) renderStub(); }, 1000);
  setInterval(() => { if (!document.hidden && !S.busy) refresh(); }, 30000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden && !S.busy) refresh(); });
})();
</script>
</body>
</html>
